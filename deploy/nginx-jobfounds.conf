# Nginx reverse proxy configuration for JOBFOUNDS on Hostinger VPS behind Cloudflare
# Domain: jobfounds.com & www.jobfounds.com (Cloudflare DNS)
# Install at: /etc/nginx/sites-available/jobfounds.com
# Enable via: sudo ln -sf /etc/nginx/sites-available/jobfounds.com /etc/nginx/sites-enabled/jobfounds.com
# SSL steps with Cloudflare:
#   1. Temporarily set A @ and A www to DNS Only (grey cloud) in Cloudflare
#   2. Run: sudo certbot --nginx -d jobfounds.com -d www.jobfounds.com
#   3. Switch A @ and A www back to Proxied (orange cloud) and set Cloudflare SSL/TLS to "Full (strict)"

server {
    listen 80;
    listen [::]:80;
    server_name jobfounds.com www.jobfounds.com;

    # Allow up to 18MB for CV PDF/DOCX uploads (/api/cv/import-file allows up to 16MB)
    client_max_body_size 18M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Generous timeout for AI grounded search & live ATS career-page monitoring
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
